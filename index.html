<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0D12" />
    <meta name="description" content="Synchro ta révision. Domine le BAC." />
    <title>SyncroBac</title>
    <!-- Splash: pure HTML/CSS so it paints before any JS downloads on slow 3G. React fades it out. -->
    <style>
      #splash { position: fixed; inset: 0; z-index: 60; display: grid; place-content: center; justify-items: center; background: radial-gradient(circle at 50% 45%, #0d2228 0%, #0A0D12 60%); transition: opacity .45s ease, transform .45s ease; }
      #splash.hide { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #splash svg { width: 150px; overflow: visible; filter: drop-shadow(0 0 16px rgba(34,193,214,.55)); }
      #splash .track { stroke: #162a30; }
      #splash .loop { stroke-dasharray: 100; animation: sb-draw 1.8s cubic-bezier(.65,0,.35,1) infinite; }
      #splash .pulse { stroke-dasharray: 40; stroke-dashoffset: 40; animation: sb-pulse 1.8s ease-in-out infinite; }
      #splash .dot { transform-origin: 60px 30px; animation: sb-dot 1.8s ease-in-out infinite; }
      #splash .word { margin-top: 26px; font: 700 20px/1 system-ui, sans-serif; letter-spacing: .14em; color: #fff; }
      #splash .word b { color: #22C1D6; }
      #splash .wave { margin-top: 14px; width: 64px; height: 10px; }
      #splash .wave path { stroke-dasharray: 8 6; animation: sb-wave 1s linear infinite; }
      @keyframes sb-draw { 0% { stroke-dashoffset: 100 } 50% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -100 } }
      @keyframes sb-pulse { 30% { stroke-dashoffset: 40 } 60% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -40 } }
      @keyframes sb-dot { 50% { transform: scale(1.7); opacity: .7 } }
      @keyframes sb-wave { to { stroke-dashoffset: -14 } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; stroke-dashoffset: 0 !important; } }
    </style>
  </head>
  <body style="background:#0A0D12">
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 120 60">
        <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#22C1D6"/><stop offset="1" stop-color="#3CCB8C"/></linearGradient></defs>
        <path class="track" d="M60 30 C45 8 15 8 15 30 C15 52 45 52 60 30 C75 8 105 8 105 30 C105 52 75 52 60 30 Z" fill="none" stroke-width="7"/>
        <path class="loop" pathLength="100" d="M60 30 C45 8 15 8 15 30 C15 52 45 52 60 30 C75 8 105 8 105 30 C105 52 75 52 60 30 Z" fill="none" stroke="url(#sg)" stroke-width="7" stroke-linecap="round"/>
        <path class="pulse" pathLength="40" d="M82 30 h6 l3 -8 l4 16 l3 -8 h6" fill="none" stroke="#22C1D6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <circle class="dot" cx="60" cy="30" r="5" fill="#F0A645"/>
      </svg>
      <div class="word">SYNCRO<b>BAC</b></div>
      <svg class="wave" viewBox="0 0 64 10"><path d="M0 5 Q8 0 16 5 T32 5 T48 5 T64 5" fill="none" stroke="#22C1D6" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
